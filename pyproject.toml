[project]
name = "TrendTropics"
authors = [
  {name = "Pedro Sousa Lacerda", email = "pslacerda@gmail.com"},
]
version = "1.0.0"
description = """
    Uma ferramenta para analisar tópicos em eventos de InfoEduc no Brasil.
"""
dependencies = [
  "cssselect>=1.6.0",
  "lxml>=6.1.3",
  "requests>=2.34.2",
  "requests-cache>=1.3.3",
  "rich>=15.0.0",
  "scikit-learn>=1.9.1",
  "textract>=2.1.0",
  "typer>=0.28.0",
]

[tool.setuptools]
packages = ["trendtropics"]

[project.scripts]
trendtropics = "trendtropics.cli:app"