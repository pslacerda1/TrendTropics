[project]
name = "TrendTropics"
authors = [
  {name = "Pedro Sousa Lacerda", email = "pslacerda@gmail.com"},
]
version = "1.0.0"
description = """
    Uma ferramenta para analisar tópicos em eventos de InfoEduc no Brasil.
"""
dependencies = [
  "cssselect>=1.6.0",
  "dash[cloud]>=4.5.0",
  "dask>=2026.8.0",
  "lxml>=6.1.3",
  "numpy>=2.5.4",
  "pandas>=3.1.1",
  "plotly[express]>=7.1.0",
  "polars>=2.1.0",
  "pyarrow>=26.0.1",
  "requests>=2.34.2",
  "requests-cache>=1.3.3",
  "rich>=15.0.0",
  "textract>=2.1.0",
  "typer>=0.29.0",
]

[tool.setuptools]
packages = ["trendtropics"]

[project.scripts]
trendtropics = "trendtropics.cli:typer_app"
